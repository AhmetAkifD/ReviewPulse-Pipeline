<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMath Chat Interface</title>
    <!-- Outfit fontunu index.html'e uygun olarak ekliyoruz -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        #chatContainer {
            width: 80%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Başlangıçta metin kutusunu ortalamak için boşluk elemanları */
        #topSpacer, #bottomSpacer {
            flex: 1;
            transition: flex 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Mesajların listeleneceği alan */
        #messagesArea {
            flex: 0;
            opacity: 0;
            overflow-y: auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: flex 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease 0.3s;
        }

        /* Aktif duruma geçince boşluklar kaybolur, mesaj alanı büyür */
        #chatContainer.active #topSpacer { flex: 0; }
        #chatContainer.active #bottomSpacer { flex: 0; }
        #chatContainer.active #messagesArea {
            flex: 1;
            opacity: 1;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Mesaj Balonları */
        .message {
            max-width: 75%;
            padding: 15px 22px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Sağ taraftaki kullanıcı mesajları */
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            border-bottom-right-radius: 5px;
        }

        /* Sol taraftaki bot/karşı taraf mesajları */
        .message.bot {
            align-self: flex-start;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 5px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Input alanı wrapper'ı */
        .input-area {
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 25px;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            align-items: center;
        }

        .input-area:focus-within {
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2);
        }

        /* style.css'teki genel text input stillerini eziyoruz */
        #chatInput {
            flex: 1;
            background: transparent !important;
            border: none !important;
            color: var(--text) !important;
            font-size: 1.1rem !important;
            padding: 10px !important;
            outline: none !important;
            margin: 0 !important;
            box-shadow: none !important;
            font-family: 'Outfit', sans-serif;
        }
        
        #chatInput:focus {
            box-shadow: none !important;
            border: none !important;
        }

        #chatInput::placeholder {
            color: var(--text-muted);
        }

        /* Gönder butonu stili */
        #btnSend {
            width: auto;
            margin: 0;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 1.1rem;
        }

        /* Mesaj alanı için kaydırma çubuğu (scrollbar) stili */
        #messagesArea::-webkit-scrollbar {
            width: 8px;
        }
        #messagesArea::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        #messagesArea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        #messagesArea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

    </style>
</head>
<body>
    <!-- index.html'deki neon arka plan efektleri -->
    <div class="glow-circle"></div>
    <div class="glow-circle-2"></div>

    <div id="chatContainer">
        <!-- Input'u ortalamak için üst boşluk -->
        <div id="topSpacer"></div>
        
        <div id="messagesArea">
            <!-- Mesajlar buraya eklenecek -->
        </div>
        
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Sistemle konuşmak için bir şeyler yazın..." autocomplete="off">
            <button id="btnSend">
                <span>Gönder</span>
            </button>
        </div>

        <!-- Input'u ortalamak için alt boşluk -->
        <div id="bottomSpacer"></div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messagesArea = document.getElementById('messagesArea');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');
        let isFirstMessage = true;

        // Mesaj ekleme fonksiyonu
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            messagesArea.appendChild(msgDiv);
            
            // Yeni mesaj eklendiğinde en alta kaydır
            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 50);
        }

        // Gönder eylemi
        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Input'u temizle
            chatInput.value = '';

            // İlk mesaj gönderildiğinde ortadaki input alanını alta kaydır (animasyon)
            if (isFirstMessage) {
                chatContainer.classList.add('active');
                isFirstMessage = false;
            }

            // Kullanıcı mesajını ekle
            addMessage(text, 'user');

            // Karşı taraftan (bot) cevap gelmesi için kısa bir gecikme simülasyonu
            setTimeout(() => {
                addMessage('mesaj sistemi çalışıyor', 'bot');
            }, 800);
        }

        // Butona tıklandığında gönder
        btnSend.addEventListener('click', handleSend);

        // Enter tuşuna basıldığında gönder
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });
        
        // Sayfa yüklendiğinde input'a odaklan
        window.onload = () => {
            chatInput.focus();
        };
    </script>
</body>
</html>
